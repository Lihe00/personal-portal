<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Lihe</title>
<style>
:root{--g:#00ff88;--p:#8800ff;--d:#0a0a0f;--c:rgba(255,255,255,0.05);--h:rgba(255,255,255,0.1);--t:#fff;--s:rgba(255,255,255,0.7);--b:rgba(255,255,255,0.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:var(--d);color:var(--t)}
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:1rem 2rem;background:rgba(10,10,15,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--b);display:flex;justify-content:space-between}
.nav-logo{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,var(--g),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:0.5rem;list-style:none}
.nav-links a{color:var(--s);text-decoration:none;padding:0.75rem 1.25rem;border-radius:12px}
.nav-links a.active{color:var(--g)}
main{padding-top:80px;min-height:100vh}
.page{display:none;padding:2rem;max-width:1200px;margin:0 auto}
.page.active{display:block}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center}
.hero-name{font-size:clamp(3rem,12vw,8rem);font-weight:900;background:linear-gradient(135deg,var(--g),var(--p));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero-stats{display:flex;gap:3rem;margin-top:3rem}
.stat-number{font-size:2.5rem;font-weight:700;color:var(--g)}
.stat-label{color:var(--s)}
.glass-card{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:2rem}
.glass-card:hover{transform:translateY(-5px)}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}
.game-card{text-align:center;cursor:pointer}
.game-icon{font-size:4rem;margin-bottom:1rem}
.btn{background:linear-gradient(135deg,var(--g),#00cc6a);border:none;border-radius:12px;padding:0.75rem 1.5rem;color:var(--d);font-size:1rem;font-weight:600;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);z-index:2000;display:none;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.active{display:flex}
.modal{background:var(--d);border:1px solid var(--b);border-radius:20px;padding:2rem;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-large{max-width:900px}
.modal-close{position:absolute;top:1rem;right:1rem;background:transparent;border:none;color:var(--s);font-size:1.5rem;cursor:pointer}
#tmntCanvas{display:block}
#snakeCanvas{border:2px solid var(--g);background:#0a0a0f}
.snake-game-container{display:flex;flex-direction:column;align-items:center;border:2px solid var(--g);border-radius:12px;padding:20px;position:relative}
.snake-header{display:flex;justify-content:space-between;width:400px;margin-bottom:10px}
.snake-score{color:var(--g)}
.snake-high-score{color:var(--p)}
.snake-game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:2rem;border-radius:12px;text-align:center;display:none;border:2px solid var(--g)}
.snake-game-over.show{display:block}
.calculator{display:grid;grid-template-columns:repeat(5,1fr);gap:0.5rem}
.calc-display{grid-column:span 5;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.3);border-radius:12px;padding:1rem 1.25rem;text-align:right;font-size:1.6rem;min-height:64px;word-break:break-all;margin-bottom:0.5rem}
.calc-btn{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:0.85rem 0.5rem;font-size:1.1rem;color:var(--t);cursor:pointer;transition:all 0.15s}
.calc-btn:hover{background:var(--h);border-color:var(--g)}
.calc-btn.op{color:var(--g);border-color:rgba(0,255,136,0.3)}
.calc-btn.func{color:var(--p);border-color:rgba(136,0,255,0.3);font-size:0.95rem}
.calc-btn.equals{background:var(--g);color:var(--d);font-weight:700}
.calc-btn.clear{color:#ff6b6b;border-color:rgba(255,107,107,0.3)}
.calc-btn.span2{grid-column:span 2}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}
.note-card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:1.5rem}
.note-category{display:inline-block;padding:0.25rem 0.75rem;border-radius:20px;font-size:0.8rem}
.note-category.suiyi{background:rgba(0,255,136,0.2);color:var(--g)}
.note-category.sikao{background:rgba(136,0,255,0.2);color:var(--p)}
.note-content{white-space:pre-wrap;word-break:break-word;line-height:1.6;margin-bottom:1rem}
.note-meta{display:flex;justify-content:space-between;padding-top:1rem;border-top:1px solid var(--b)}
.note-time{color:var(--s);font-size:0.85rem}
.form-textarea{width:100%;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:1rem;color:var(--t);resize:vertical;min-height:100px;margin-bottom:1rem}
.form-select,.form-input{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:0.75rem;color:var(--t)}
.filter-btn{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:0.5rem 1rem;color:var(--s);cursor:pointer}
.filter-btn.active{background:rgba(0,255,136,0.2);border-color:var(--g);color:var(--g)}
.countdown-display{font-size:3rem;text-align:center;padding:2rem;background:var(--c);border-radius:12px;margin-bottom:1.5rem}
.countdown-inputs{display:flex;justify-content:center;gap:1rem;margin-bottom:1.5rem}
.countdown-input-group{display:flex;flex-direction:column;align-items:center;gap:0.5rem}
.countdown-input-group label{color:var(--s);font-size:0.85rem}
.countdown-input-group input{width:80px;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:0.75rem;color:var(--t);font-size:1.25rem;text-align:center}
.countdown-btns{display:flex;justify-content:center;gap:1rem}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem}
</style>
</head>
<body>
<nav>
<div class="nav-logo">Lihe</div>
<ul class="nav-links">
<li><a href="#home" class="active" data-page="home">首页</a></li>
<li><a href="#notes" data-page="notes">随笔</a></li>
<li><a href="#games" data-page="games">游戏</a></li>
<li><a href="#tools" data-page="tools">工具</a></li>
<li><a href="#about" data-page="about">关于</a></li>
</ul>
</nav>
<main>
<div class="page active" id="page-home">
<div class="hero">
<h1 class="hero-name">Lihe</h1>
<p style="font-size:1.3rem;color:var(--s);margin-top:1rem">创作者 · 思考者 · 开发者</p>
<div class="hero-stats">
<div class="stat-item"><div class="stat-number" id="stat-notes">0</div><div class="stat-label">随笔</div></div>
<div class="stat-item"><div class="stat-number">2</div><div class="stat-label">游戏</div></div>
<div class="stat-item"><div class="stat-number">3</div><div class="stat-label">工具</div></div>
</div>
</div>
</div>
<div class="page" id="page-notes">
<h2 style="font-size:2rem;margin-bottom:2rem">随笔</h2>
<div style="display:flex;gap:0.5rem;margin-bottom:1.5rem">
<button class="filter-btn active" data-filter="all">全部</button>
<button class="filter-btn" data-filter="随笔">随笔</button>
<button class="filter-btn" data-filter="思考">思考</button>
</div>
<div class="glass-card" style="margin-bottom:2rem">
<textarea class="form-textarea" id="noteContent" placeholder="写下你的想法..."></textarea>
<div style="display:flex;gap:1rem;flex-wrap:wrap">
<select class="form-select" id="noteCategory"><option value="随笔">随笔</option><option value="思考">思考</option></select>
<button class="btn" onclick="addNote()">发布</button>
</div>
</div>
<div class="notes-grid" id="notesGrid"></div>
</div>
<div class="page" id="page-games">
<h2 style="font-size:2rem;margin-bottom:2rem">游戏</h2>
<div class="games-grid">
<div class="glass-card game-card" onclick="openTmntGame()"><div class="game-icon">🐢</div><h3>忍者神龟</h3><p style="color:var(--s);margin:1rem 0">经典街机游戏</p><button class="btn">开始游戏</button></div>
<div class="glass-card game-card" onclick="openSnakeGame()"><div class="game-icon">🐍</div><h3>贪吃蛇</h3><p style="color:var(--s);margin:1rem 0">经典贪吃蛇</p><button class="btn">开始游戏</button></div>
</div>
</div>
<div class="page" id="page-tools">
<h2 style="font-size:2rem;margin-bottom:2rem">工具</h2>
<div class="tools-grid">
<div class="glass-card" onclick="openModal('calculator')"><div class="game-icon">🧮</div><h3>计算器</h3></div>
<div class="glass-card" onclick="openModal('countdown')"><div class="game-icon">⏱️</div><h3>倒计时</h3></div>
</div>
</div>
<div class="page" id="page-about">
<h2 style="font-size:2rem;margin-bottom:2rem">关于</h2>
<div class="glass-card"><p style="color:var(--s)">Lihe的个人空间</p></div>
</div>
</main>
<div class="modal-overlay" id="modal-tmnt">
<div class="modal modal-large">
<button class="modal-close" onclick="closeTmntGame()">×</button>
<h3 style="margin-bottom:1rem">忍者神龟</h3>
<canvas id="tmntCanvas" width="640" height="400"></canvas>
<div style="padding:8px;background:#0d081a;font-size:11px;color:#8070a0;text-align:center">方向键移动 W跳跃 X攻击</div>
</div>
</div>
<div class="modal-overlay" id="modal-snake">
<div class="modal">
<button class="modal-close" onclick="closeSnakeGame()">×</button>
<h3 style="margin-bottom:1rem">贪吃蛇</h3>
<div class="snake-game-container">
<div class="snake-header"><span class="snake-score">得分: <span id="snakeScore">0</span></span><span class="snake-high-score">最高: <span id="snakeHighScore">0</span></span></div>
<canvas id="snakeCanvas" width="400" height="400"></canvas>
<div class="snake-game-over" id="snakeGameOver"><h3>游戏结束!</h3><p>得分: <span id="finalScore">0</span></p><button class="btn" onclick="restartSnake()">重新开始</button></div>
<div style="margin-top:15px;color:var(--s)">方向键或WASD控制</div>
</div>
</div>
</div>
<div class="modal-overlay" id="modal-calculator">
<div class="modal">
<button class="modal-close" onclick="closeModal('calculator')">×</button>
<h3 style="margin-bottom:1rem">科学计算器</h3>
<div class="calculator">
<div class="calc-display" id="calcDisplay">0</div>
<button class="calc-btn clear" onclick="calcClear()">C</button>
<button class="calc-btn func" onclick="calcFunc('sqrt')">√</button>
<button class="calc-btn func" onclick="calcFunc('pow2')">x²</button>
<button class="calc-btn func" onclick="calcFunc('pow3')">x³</button>
<button class="calc-btn op" onclick="calcOp('/')">÷</button>
<button class="calc-btn" onclick="calcNum('7')">7</button>
<button class="calc-btn" onclick="calcNum('8')">8</button>
<button class="calc-btn" onclick="calcNum('9')">9</button>
<button class="calc-btn op" onclick="calcOp('*')">×</button>
<button class="calc-btn func" onclick="calcFunc('sin')">sin</button>
<button class="calc-btn" onclick="calcNum('4')">4</button>
<button class="calc-btn" onclick="calcNum('5')">5</button>
<button class="calc-btn" onclick="calcNum('6')">6</button>
<button class="calc-btn op" onclick="calcOp('-')">-</button>
<button class="calc-btn func" onclick="calcFunc('cos')">cos</button>
<button class="calc-btn" onclick="calcNum('1')">1</button>
<button class="calc-btn" onclick="calcNum('2')">2</button>
<button class="calc-btn" onclick="calcNum('3')">3</button>
<button class="calc-btn op" onclick="calcOp('+')">+</button>
<button class="calc-btn func" onclick="calcFunc('tan')">tan</button>
<button class="calc-btn" onclick="calcNum('0')" style="grid-column:span 2">0</button>
<button class="calc-btn" onclick="calcNum('.')">.</button>
<button class="calc-btn func" onclick="calcFunc('log')">log</button>
<button class="calc-btn equals" onclick="calcEq()" style="grid-column:span 2">=</button>
<button class="calc-btn func" onclick="calcFunc('ln')">ln</button>
<button class="calc-btn func" onclick="calcFunc('pi')">π</button>
<button class="calc-btn func" onclick="calcFunc('e')">e</button>
<button class="calc-btn func" onclick="calcFunc('fact')">n!</button>
<button class="calc-btn func" onclick="calcFunc('inv')">1/x</button>
</div>
</div>
</div>
<div class="modal-overlay" id="modal-countdown">
<div class="modal">
<button class="modal-close" onclick="closeModal('countdown')">×</button>
<h3 style="margin-bottom:1rem">倒计时</h3>
<div class="countdown-display" id="countDisplay">00:00:00</div>
<div class="countdown-inputs">
<div class="countdown-input-group"><label>时</label><input type="number" id="countH" min="0" max="99" value="0"></div>
<div class="countdown-input-group"><label>分</label><input type="number" id="countM" min="0" max="59" value="0"></div>
<div class="countdown-input-group"><label>秒</label><input type="number" id="countS" min="0" max="59" value="0"></div>
</div>
<div class="countdown-btns">
<button class="btn" onclick="countStart()">开始</button>
<button class="btn" onclick="countReset()" style="background:var(--c);color:var(--t)">重置</button>
</div>
</div>
</div>
<script>
var audioCtx=new(window.AudioContext||window.webkitAudioContext);
function playSound(freq,dur,type,v){try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=type||'square';o.frequency.value=freq;g.gain.setValueAtTime(v||0.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function playEat(){playSound(600,0.1,'square',0.15)}
function playGameOver(){playSound(200,0.5,'sawtooth',0.2)}
var notes=JSON.parse(localStorage.getItem('lihe-notes')||'[]');
var preloadedId='why-start-2026';
if(notes.length===0||!notes.some(function(n){return n.id===preloadedId})){
notes.unshift({id:preloadedId,category:'随笔',tags:['开始','记录','成长'],title:'为什么开始',content:"有时候，开始一件事不需要理由。\n\n但如果非要说一个，那大概是——我想留下点什么。\n\n不是给别人看的，是给未来的自己看的。某一天翻回来，看看那时候在想什么，在做什么，在乎什么。那种感觉，比任何相册都真实。\n\n这个小站就是这样来的。没有宏大的计划，没有精心的设计路线图。就是某天突然觉得：我应该有个地方，能放我自己的东西。\n\n游戏是我做的，工具是我需要的，随笔是我想说的。慢慢来，慢慢填。\n\n也许以后会有人路过，也许不会。但这里首先是我自己的地方。\n\n——Lihe，2026年3月25日",timestamp:'2026-03-25T07:18:00.000Z'});
localStorage.setItem('lihe-notes',JSON.stringify(notes))}
function saveNotes(){localStorage.setItem('lihe-notes',JSON.stringify(notes));renderNotes();document.getElementById('stat-notes').textContent=notes.length}
function renderNotes(){var grid=document.getElementById('notesGrid');if(notes.length===0){grid.innerHTML='<div style="text-align:center;padding:4rem;color:var(--s)">还没有随笔</div>';return}grid.innerHTML=notes.map(function(n){return'<div class="note-card"><span class="note-category '+getCatClass(n.category)+'">'+n.category+'</span><div class="note-content">'+escapeHtml(n.content)+'</div><div class="note-meta"><span class="note-time">'+new Date(n.timestamp).toLocaleDateString('zh-CN')+'</span></div></div>'}).join('')}
function getCatClass(c){return c==='随笔'?'suiyi':'sikao'}
function escapeHtml(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function addNote(){var content=document.getElementById('noteContent').value.trim();var category=document.getElementById('noteCategory').value;if(!content)return;notes.unshift({id:Date.now(),content:content,category:category,timestamp:Date.now()});document.getElementById('noteContent').value='';saveNotes()}
document.querySelectorAll('.filter-btn').forEach(function(btn){btn.addEventListener('click',function(){document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active')});this.classList.add('active')})});
function showPage(id){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.querySelectorAll('.nav-links a').forEach(function(a){a.classList.remove('active')});document.getElementById('page-'+id).classList.add('active');var na=document.querySelector('.nav-links a[data-page="'+id+'"]');if(na)na.classList.add('active')}
window.addEventListener('hashchange',function(){showPage(window.location.hash.slice(1)||'home')});
showPage(window.location.hash.slice(1)||'home');
document.querySelectorAll('.nav-links a').forEach(function(a){a.addEventListener('click',function(){showPage(this.dataset.page)})});
function openModal(id){document.getElementById('modal-'+id).classList.add('active')}
function closeModal(id){document.getElementById('modal-'+id).classList.remove('active')}
document.querySelectorAll('.modal-overlay').forEach(function(o){o.addEventListener('click',function(e){if(e.target===this)this.classList.remove('active')})});
var calcVal='0',calcOp2=null,calcPrev=null,calcFunc=null;
function calcNum(n){if(calcVal==='0'&&n!=='.')calcVal=n;else calcVal+=n;document.getElementById('calcDisplay').textContent=calcVal}
function calcOp(op){if(calcOp2&&!calcFunc)calcEq();calcPrev=calcVal;calcOp2=op;calcFunc=null}
function calcEq(){if(calcOp2===null)return;var p=parseFloat(calcPrev),c=parseFloat(calcVal),r;switch(calcOp2){case'+':r=p+c;break;case'-':r=p-c;break;case'*':r=p*c;break;case'/':r=c!==0?p/c:'Error';break}calcVal=String(r);if(calcVal==='NaN')calcVal='Error';calcOp2=null;calcPrev=null;calcFunc=null;document.getElementById('calcDisplay').textContent=calcVal}
function calcFunc(fn){var v=parseFloat(calcVal),r;switch(fn){case'sqrt':r=v>=0?Math.sqrt(v):'Error';break;case'pow2':r=v*v;break;case'pow3':r=v*v*v;break;case'sin':r=Math.sin(v*Math.PI/180);break;case'cos':r=Math.cos(v*Math.PI/180);break;case'tan':r=Math.tan(v*Math.PI/180);break;case'log':r=v>0?Math.log10(v):'Error';break;case'ln':r=v>0?Math.log(v):'Error';break;case'fact':r=(v>=0&&Number.isInteger(v)&&v<=170)?fact(v):'Error';break;case'inv':r=v!==0?1/v:'Error';break;case'pi':calcVal='0';document.getElementById('calcDisplay').textContent=Math.PI;return;case'e':calcVal='0';document.getElementById('calcDisplay').textContent=Math.E;return}if(r==='Error'){calcVal='0'}else{r=Math.round(r*1e12)/1e12;calcVal=String(r)}document.getElementById('calcDisplay').textContent=calcVal}
function fact(n){if(n===0||n===1)return 1;return n*fact(n-1)}
function calcClear(){calcVal='0';calcOp2=null;calcPrev=null;calcFunc=null;document.getElementById('calcDisplay').textContent='0'}
document.addEventListener('keydown',function(e){var k=e.key;if(k>='0'&&k<='9')calcNum(k);else if(k==='.')calcNum('.');else if(k==='+'||k==='-'||k==='*'||k==='/')calcOp(k);else if(k==='Enter'||k==='=')calcEq();else if(k==='Escape'||k==='c'||k==='C')calcClear()});
var countInterval=null,countRemaining=0;
function countUpdateDisplay(){var h=Math.floor(countRemaining/3600),m=Math.floor((countRemaining%3600)/60),s=countRemaining%60;document.getElementById('countDisplay').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function countStart(){if(countInterval)return;if(countRemaining===0){countRemaining=(parseInt(document.getElementById('countH').value)||0)*3600+(parseInt(document.getElementById('countM').value)||0)*60+(parseInt(document.getElementById('countS').value)||0)}if(countRemaining<=0)return;countInterval=setInterval(function(){countRemaining--;countUpdateDisplay();if(countRemaining<=0){clearInterval(countInterval);countInterval=null;alert('倒计时结束!')}},1000)}
function countReset(){if(countInterval){clearInterval(countInterval);countInterval=null}countRemaining=0;document.getElementById('countH').value='0';document.getElementById('countM').value='0';document.getElementById('countS').value='0';countUpdateDisplay()}
var tmntRAF=null;
function openTmntGame(){document.getElementById('modal-tmnt').classList.add('active');initTmntGame()}
function closeTmntGame(){document.getElementById('modal-tmnt').classList.remove('active');if(tmntRAF){cancelAnimationFrame(tmntRAF);tmntRAF=null}}
function initTmntGame(){var CV=document.getElementById('tmntCanvas');var CX=CV.getContext('2d');var CW=640,CH=400,GY=CH-60;var score=0,lives=3,hp=3;var ks={};var p={x:60,y:300,w:28,h:38,vx:0,vy:0,g:false,f:1,hp:3,inv:0};var ens=[];var blls=[];var LD={pf:[[120,280,100,14],[320,240,120,14],[520,290,90,14],[720,250,100,14]],bg:'#0d0a1a',lw:850};ens=[{t:'s',x:200,y:300,vx:1.5,w:24,h:36,hp:1},{t:'s',x:450,y:300,vx:-1.5,w:24,h:36,hp:1},{t:'m',x:600,y:300,vx:1,w:22,h:22,hp:2}];function DL(){CX.fillStyle=LD.bg;CX.fillRect(0,0,CW,CH);CX.fillStyle='#3a3';for(var i=0;i<LD.pf.length;i++){var pf=LD.pf[i];CX.fillRect(pf[0],pf[2],pf[1],pf[3])}CX.fillStyle='#0a0';CX.fillRect(0,GY,CW,CH-GY)}
function DG(){CX.fillStyle='#2c4';CX.fillRect(p.x,p.y,p.w,p.h);CX.fillStyle='#111';CX.beginPath();CX.arc(p.x+8,p.y+8,3,0,Math.PI*2);CX.arc(p.x+18,p.y+8,3,0,Math.PI*2);CX.fill()}
function DE(e){if(e.t==='s'){CX.fillStyle='#c33';CX.fillRect(e.x,e.y,e.w,e.h);CX.fillStyle='#fff';CX.fillRect(e.x+4,e.y+8,4,4);CX.fillRect(e.x+14,e.y+8,4,4)}else{CX.fillStyle='#888';CX.beginPath();CX.arc(e.x+e.w/2,e.y+e.h/2,e.w/2,0,Math.PI*2);CX.fill()}}
function UP(){if(ks.ArrowLeft||ks.KeyA){p.vx=-3;p.f=-1}else if(ks.ArrowRight||ks.KeyD){p.vx=3;p.f=1}else p.vx*=0.8;if((ks.ArrowUp||ks.KeyW||ks.Space)&&p.g){p.vy=-9;p.g=false}p.vy+=0.4;var ny=p.y+p.vy;if(ny+p.h>=GY){ny=GY-p.h;p.vy=0;p.g=true}for(var i=0;i<LD.pf.length;i++){var pf=LD.pf[i];if(p.x+p.w>pf[0]&&p.x<pf[0]+pf[1]&&p.y+p.h<=pf[2]+4){ny=pf[2]-p.h;p.vy=0;p.g=true}}p.x+=p.vx;if(p.x<0)p.x=0;if(p.x+p.w>LD.lw)p.x=LD.lw-p.w;p.y=ny;if(ks.KeyX){blls.push({x:p.x+p.w/2+p.f*16,y:p.y+p.h/2-4,vx:p.f*7});ks.KeyX=false}for(var i=ens.length-1;i>=0;i--){var e=ens[i];e.x+=e.vx;if(e.x<20||e.x+e.w>LD.lw-20)e.vx*=-1;if(p.inv===0&&Math.abs(p.x-e.x)<20&&Math.abs(p.y-e.y)<30){hp--;p.inv=60;if(hp<=0){lives--;hp=3;p.x=60;p.y=300}}}for(var i=blls.length-1;i>=0;i--){var b=blls[i];b.x+=b.vx;for(var j=ens.length-1;j>=0;j--){var e=ens[j];if(Math.abs(b.x-e.x)<e.w/2&&Math.abs(b.y-e.y)<e.h/2){e.hp--;blls.splice(i,1);if(e.hp<=0){score+=e.t==='m'?50:30;ens.splice(j,1)}}}}}
function gameLoop(){DL();for(var i=0;i<ens.length;i++)DE(ens[i]);for(var i=0;i<blls.length;i++){CX.fillStyle='#ff0';CX.fillRect(blls[i].x,blls[i].y,6,4)}DG();UP();document.getElementById('tmntScore').textContent=score;document.getElementById('tmntLives').textContent=lives;document.getElementById('tmntHp').textContent=hp;tmntRAF=requestAnimationFrame(gameLoop)}
document.addEventListener('keydown',function(e){ks[e.code]=true});
document.addEventListener('keyup',function(e){ks[e.code]=false});
gameLoop()}
var snakeRunning=false;var snakeRAF=null;var snakeHighScore=parseInt(localStorage.getItem('snakeHighScore')||'0');
function openSnakeGame(){document.getElementById('modal-snake').classList.add('active');document.getElementById('snakeHighScore').textContent=snakeHighScore;initSnakeGame()}
function closeSnakeGame(){document.getElementById('modal-snake').classList.remove('active');document.getElementById('snakeGameOver').classList.remove('show');if(snakeRAF){cancelAnimationFrame(snakeRAF);snakeRAF=null}snakeRunning=false}
function initSnakeGame(){var CV=document.getElementById('snakeCanvas');var CX=CV.getContext('2d');var W=400,H=400,GRID=20;var snake=[{x:10,y:10}],food={x:15,y:15},dir={x:1,y:0},nextDir={x:1,y:0},score=0,speed=150,gameOver=false;document.getElementById('snakeScore').textContent='0';document.getElementById('snakeGameOver').classList.remove('show');function draw(){CX.fillStyle='#0a0a0f';CX.fillRect(0,0,W,H);CX.strokeStyle='rgba(0,255,136,0.1)';for(var x=0;x<=W;x+=GRID)CX.beginPath(),CX.moveTo(x,0),CX.lineTo(x,H),CX.stroke();for(var y=0;y<=H;y+=GRID)CX.beginPath(),CX.moveTo(0,y),CX.lineTo(W,y),CX.stroke();CX.fillStyle='#f00';CX.beginPath();CX.arc(food.x*GRID+GRID/2,food.y*GRID+GRID/2,GRID/2-2,0,Math.PI*2);CX.fill();CX.fillStyle='#00ff88';for(var i=0;i<snake.length;i++){CX.fillRect(snake[i].x*GRID,snake[i].y*GRID,GRID-2,GRID-2)}}
function update(){if(gameOver)return;dir=nextDir;var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.x>=W/GRID||head.y<0||head.y>=H/GRID||snake.some(function(s){return s.x===head.x&&s.y===head.y})){gameOver=true;playGameOver();if(score>snakeHighScore){snakeHighScore=score;localStorage.setItem('snakeHighScore',snakeHighScore);document.getElementById('snakeHighScore').textContent=snakeHighScore}document.getElementById('finalScore').textContent=score;document.getElementById('snakeGameOver').classList.add('show');return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=10;document.getElementById('snakeScore').textContent=score;playEat();food={x:Math.floor(Math.random()*(W/GRID)),y:Math.floor(Math.random()*(H/GRID))};if(speed>50)speed-=2}else{snake.pop()}}
function loop(){update();draw();snakeRAF=requestAnimationFrame(loop)}
document.addEventListener('keydown',function(e){var key=e.key.toLowerCase();if(key==='arrowup'||key==='w')nextDir={x:0,y:-1};else if(key==='arrowdown'||key==='s')nextDir={x:0,y:1};else if(key==='arrowleft'||key==='a')nextDir={x:-1,y:0};else if(key==='arrowright'||key==='d')nextDir={x:1,y:0}});
loop()}
function restartSnake(){document.getElementById('snakeGameOver').classList.remove('show');initSnakeGame()}
renderNotes();document.getElementById('stat-notes').textContent=notes.length;
</script>
